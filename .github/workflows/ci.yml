name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zyven_test
          POSTGRES_USER: zyven
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U zyven -d zyven_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Database: Host=localhost;Database=zyven_test;Username=zyven;Password=ci-ephemeral-only
      ConnectionStrings__Redis: localhost:6379,abortConnect=false
      Jwt__SigningKey: ci-only-signing-key-not-valid-outside-ephemeral-test-environment-2026
      Jwt__Issuer: Zyven
      Jwt__Audience: Zyven.Web
      Cors__AllowedOrigins__0: http://localhost:8088
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build Zyven.slnx -c Release
      - run: dotnet run --no-build -c Release --project src/Api -- --migrate
      - run: dotnet test Zyven.slnx -c Release --no-build
      - run: dotnet format Zyven.slnx --verify-no-changes --no-restore
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/Infrastructure --startup-project src/Api
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
